<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Polished & Pristine · media review</title><link rel="stylesheet" href="/app.css"></head><body>
<header class="top"><div><span class="brand">Polished & Pristine</span><span class="sub">Private media review</span></div><div class="count" id="count"></div></header>
<main><aside class="rail"><div class="rail-title">Browse assets</div><label>Search filenames<input id="search" type="search" placeholder="Vehicle, job or filename"></label><label>Media type<select id="type"><option value="all">All media</option><option value="photo">Photographs</option><option value="video">Videos</option></select></label><label>Service type<select id="service"><option value="all">All services</option><option value="ceramic">Ceramic coating</option><option value="paint">Paint enhancement</option><option value="interior">Interior cleaning</option><option value="exterior">Exterior / general</option></select></label><label>Marks<select id="marked"><option value="all">All assets</option><option value="favourite">Favourites</option><option value="candidate">Page candidates</option></select></label><div class="rail-title jobs-title">Jobs</div><nav id="folders" aria-label="Source folders"></nav><p class="hint">Marks are saved in this browser on this computer. Originals are opened from the local source folder.</p></aside><section class="content"><div class="intro"><div><h1>Media library</h1><p>Review original work, compare frames and mark candidates for the website.</p></div><button id="export" type="button">Export marks</button></div><div id="results"></div></section></main>
<dialog id="viewer"><button class="close" aria-label="Close viewer">×</button><div id="viewerContent"></div></dialog><script type="module" src="/app.js"></script></body></html>
