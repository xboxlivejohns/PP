<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://polishedpristinedetailing.co.uk/gallery/">
  <title>Page moved | Polished &amp; Pristine</title>
  <script>
    (() => {
      const redirect = {"target":"/gallery/","fragments":{}};
      const fragmentTarget = redirect.fragments[location.hash];
      const destination = new URL(fragmentTarget || redirect.target, location.origin);
      destination.search = location.search;
      if (!fragmentTarget && location.hash) destination.hash = location.hash;
      location.replace(destination.href);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/gallery/">
</head>
<body>
  <p>This page has moved. <a href="/gallery/">Continue to Polished &amp; Pristine</a>.</p>
</body>
</html>
