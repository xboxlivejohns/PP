<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact for a Quote | Polished &amp; Pristine Mobile</title>
  <meta name="description" content="Contact Polished &amp; Pristine Mobile by WhatsApp or phone to request a detailing quote.">
  <link rel="canonical" href="https://polishedandpristinemobile.co.uk/booking.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Polished and Pristine Mobile home">

      </a>
      <a class="btn btn-small btn-secondary" href="index.html">Back to website</a>

  </header>
  <main class="booking-page">
    <section class="booking-cta section-pad" aria-labelledby="booking-title">
      <div class="container narrow booking-card">

        <h1 id="booking-title">Get your detailing quote.</h1>

        <div class="booking-actions" aria-label="Contact options">
          <a class="btn btn-primary whatsapp-button" href="https://wa.me/447468286651?text=Hi%20John,%20I'd%20like%20to%20get%20a%20quote%20for%20a%20detail">Message on WhatsApp</a>
          <a class="btn btn-secondary" href="tel:07776732135">Call 07776732135</a>
        </div>
        <p class="booking-phone">Prefer to speak first? Call or WhatsApp <a href="tel:07776732135">07776732135</a>.</p>
      </div>
    </section>
  </main>
